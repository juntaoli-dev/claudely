# electron-builder.yml

# The unique application ID
appId: com.juntaoli.claudely

# The user-facing application name
productName: Claudely

# Publish configuration for GitHub releases
publish:
    provider: github
    owner: juntaoli
    repo: claudely
    releaseType: draft

# Protocols configuration for deep linking
protocols:
    name: Claudely Protocol
    schemes:
        - claudely

# List of files to be included in the app package
files:
    - src/**/*
    - package.json
    - web/backend_node/**/*
    - '!**/node_modules/electron/**'
    - public/build/**/*

# Additional resources to be copied into the app's resources directory
extraResources:
    - from: web/out
      to: out

asarUnpack:
    - "src/ui/assets/SystemAudioDump"
    - "src/ui/assets/bin/audio-capture"
    - "src/ui/assets/bin/classifier"
    - "**/node_modules/sharp/**/*"
    - "**/node_modules/@img/**/*"

# Windows configuration
win:
    icon: src/ui/assets/logo.ico
    target:
        - target: nsis
          arch: x64
        - target: portable
          arch: x64
    requestedExecutionLevel: asInvoker
    signAndEditExecutable: true
    cscLink: build\certs\glass-dev.pfx
    cscKeyPassword: "${env.CSC_KEY_PASSWORD}"
    signtoolOptions:
      certificateSubjectName: "Claudely Dev Code Signing"

# NSIS installer configuration for Windows
nsis:
    oneClick: false
    perMachine: false
    allowToChangeInstallationDirectory: true
    deleteAppDataOnUninstall: true
    createDesktopShortcut: always
    createStartMenuShortcut: true
    shortcutName: Claudely

# macOS specific configuration
mac:
    # The application category type
    category: public.app-category.utilities
    # Path to the .icns icon file
    icon: src/ui/assets/logo.icns
    # Minimum macOS version (supports both Intel and Apple Silicon)
    minimumSystemVersion: '11.0'
    hardenedRuntime: true
    gatekeeperAssess: false
    # Set to "Claudely Dev Local" once `security set-key-partition-list` has
    # been run interactively to grant codesign permission to the self-signed
    # cert. Defaults to null so the build pipeline doesn't hang waiting for a
    # GUI password prompt.
    identity: null
    entitlements: entitlements.plist
    entitlementsInherit: entitlements.plist
    extendInfo:
        LSUIElement: true
        NSMicrophoneUsageDescription: "Claudely captures your voice during meetings to transcribe what you say."
        NSScreenCaptureUsageDescription: "Claudely captures meeting audio and the current screen so it can answer questions about what's on the call."
        NSCameraUsageDescription: "Claudely never uses the camera; this declaration is required by ScreenCaptureKit."
        NSAppleEventsUsageDescription: "Claudely uses Apple Events for window management."
    target:
      - target: dmg
        arch: universal
      - target: zip
        arch: universal
