<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="content-security-policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval'" />
        <title>Pickle Claudely Content</title>
        <style>
            :root {
                --background-transparent: transparent;
                --text-color: #e5e5e7;
                --border-color: rgba(255, 255, 255, 0.2);
                --header-background: rgba(0, 0, 0, 0.8);
                --header-actions-color: rgba(255, 255, 255, 0.6);
                --main-content-background: rgba(0, 0, 0, 0.8);
                --button-background: rgba(0, 0, 0, 0.5);
                --button-border: rgba(255, 255, 255, 0.1);
                --icon-button-color: rgb(229, 229, 231);
                --hover-background: rgba(255, 255, 255, 0.1);
                --input-background: rgba(0, 0, 0, 0.3);
                --placeholder-color: rgba(255, 255, 255, 0.4);
                --accent: #ec4899;
                --accent-rgb: 236, 72, 153;
                --accent-hover: #be185d;
                --focus-border-color: var(--accent);
                --focus-box-shadow: rgba(var(--accent-rgb), 0.2);
                --input-focus-background: rgba(0, 0, 0, 0.5);
                --scrollbar-track: rgba(0, 0, 0, 0.2);
                --scrollbar-thumb: rgba(255, 255, 255, 0.2);
                --scrollbar-thumb-hover: rgba(255, 255, 255, 0.3);
                --preview-video-background: rgba(0, 0, 0, 0.9);
                --preview-video-border: rgba(255, 255, 255, 0.15);
                --option-label-color: rgba(255, 255, 255, 0.8);
                --screen-option-background: rgba(0, 0, 0, 0.4);
                --screen-option-hover-background: rgba(0, 0, 0, 0.6);
                --screen-option-selected-background: rgba(var(--accent-rgb), 0.15);
                --screen-option-text: rgba(255, 255, 255, 0.7);
                --description-color: rgba(255, 255, 255, 0.6);
                --start-button-background: white;
                --start-button-color: black;
                --start-button-border: white;
                --start-button-hover-background: rgba(255, 255, 255, 0.8);
                --start-button-hover-border: rgba(0, 0, 0, 0.2);
                --text-input-button-background: var(--accent);
                --text-input-button-hover: var(--accent-hover);
                --link-color: var(--accent);
                --key-background: rgba(255, 255, 255, 0.1);
                --scrollbar-background: rgba(0, 0, 0, 0.4);

                /* Layout-specific variables */
                --header-padding: 10px 20px;
                --header-font-size: 16px;
                --header-gap: 12px;
                --header-button-padding: 8px 16px;
                --header-icon-padding: 8px;
                --header-font-size-small: 13px;
                --main-content-padding: 20px;
                --main-content-margin-top: 10px;
                --icon-size: 24px;
                --border-radius: 7px;
                --content-border-radius: 7px;
            }

            /* Theme palette overrides. content.html's :root defines a pink
               default; per-theme blocks below override --accent et al. */
            :root[data-theme="default"] {
                --accent: #007aff;
                --accent-rgb: 0, 122, 255;
                --accent-hover: #0056b3;
            }
            :root[data-theme="pink"] {
                --accent: #ec4899;
                --accent-rgb: 236, 72, 153;
                --accent-hover: #be185d;
            }
            :root[data-theme="mint"] {
                --accent: #10b981;
                --accent-rgb: 16, 185, 129;
                --accent-hover: #047857;
            }
            :root[data-theme="amber"] {
                --accent: #f59e0b;
                --accent-rgb: 245, 158, 11;
                --accent-hover: #b45309;
            }
            :root[data-theme="purple"] {
                --accent: #a855f7;
                --accent-rgb: 168, 85, 247;
                --accent-hover: #7e22ce;
            }
            :root[data-theme="red"] {
                --accent: #ef4444;
                --accent-rgb: 239, 68, 68;
                --accent-hover: #b91c1c;
            }

            /* Compact layout styles */
            :root.compact-layout {
                --header-padding: 6px 12px;
                --header-font-size: 13px;
                --header-gap: 6px;
                --header-button-padding: 4px 8px;
                --header-icon-padding: 4px;
                --header-font-size-small: 10px;
                --main-content-padding: 10px;
                --main-content-margin-top: 2px;
                --icon-size: 16px;
                --border-radius: 4px;
                --content-border-radius: 4px;
            }

            html,
            body {
                margin: 0;
                padding: 0;
                min-height: 100%;
                overflow: hidden;
                background: transparent;
            }

            body {
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            }

            * {
                box-sizing: border-box;
            }

            claudely-app {
                display: block;
                width: 100%;
                transform: translate3d(0, 0, 0);
                backface-visibility: hidden;
                perspective: 1000px;
                transform-origin: center center;
                contain: layout style paint;
                transition: transform 0.25s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.25s ease-out;
            }
        </style>
    </head>
    <body>
        <script src="../assets/marked-4.3.0.min.js"></script>
        
        <script type="module" src="../../../public/build/content.js"></script>

        <claudely-app id="claudely"></claudely-app>
        
        <script>
            window.addEventListener('DOMContentLoaded', () => {
                const app = document.getElementById('claudely');

            });
        </script>
        <script>
            const params = new URLSearchParams(window.location.search);
            if (params.get('glass') === 'true') {
                document.body.classList.add('has-glass');
            }
            // Persisted theme. Set early to avoid a flash of wrong palette.
            (async () => {
                try {
                    const t = await window.api?.theme?.get?.();
                    document.documentElement.dataset.theme = t || 'pink';
                } catch {
                    document.documentElement.dataset.theme = 'pink';
                }
            })();
            window.api?.theme?.onChanged?.((event, name) => {
                document.documentElement.dataset.theme = name || 'pink';
            });
        </script>
    </body>
</html>
